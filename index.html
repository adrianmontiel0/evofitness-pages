<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EvoFitness Gym</title>
<meta name="description" content="App oficial de EvoFitness Gym — Mazatlán." />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-secondary: #334155;
    --text-muted: #64748b;
    --primary: #6366f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #818cf8;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 540px;
    width: 100%;
    padding: 32px 24px;
    text-align: center;
  }
  .logo {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    color: var(--primary);
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 36px;
    letter-spacing: -0.03em;
  }
  .tagline {
    color: var(--text-muted);
    font-size: 16px;
    margin-bottom: 40px;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .link {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    text-decoration: none;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: transform 0.1s ease, border-color 0.1s ease;
  }
  .link:hover {
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .link .label {
    font-weight: 600;
    text-align: left;
  }
  .link .arrow {
    color: var(--text-muted);
    font-size: 20px;
  }
  footer {
    margin-top: 48px;
    color: var(--text-muted);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">EvoFitness Gym</div>
    <h1>Tu gimnasio en el bolsillo</h1>
    <p class="tagline">Mazatlán, Sinaloa</p>
    <div class="links">
      <a class="link" href="./soporte.html">
        <span class="label">Soporte</span>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="link" href="./privacidad.html">
        <span class="label">Aviso de Privacidad</span>
        <span class="arrow">&rarr;</span>
      </a>
    </div>
    <footer>© EvoFitness Gym</footer>
  </div>
</body>
</html>
